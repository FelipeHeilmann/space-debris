name: Provisionar Infraestrutura (Terraform)

on:
  workflow_dispatch:
  push:
    paths:
      - 'sdtcc/infra/**'

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Login no Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Exportar credenciais ARM para o Terraform
        run: |
          echo "ARM_CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientId)" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientSecret)" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .subscriptionId)" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .tenantId)" >> $GITHUB_ENV

      - name: Criar backend de state (Azure Storage)
        run: |
          az group create \
            --name rg-tfstate \
            --location eastus2 \
            --output none
          az storage account create \
            --name stspacedebristf26 \
            --resource-group rg-tfstate \
            --location eastus2 \
            --sku Standard_LRS \
            --output none
          az storage container create \
            --name tfstate \
            --account-name stspacedebristf26 \
            --output none

      - name: Terraform Init
        working-directory: sdtcc/infra
        run: terraform init

      - name: Terraform Plan
        working-directory: sdtcc/infra
        run: terraform plan -var="n2yo_api_key=${{ secrets.N2YO_API_KEY }}"

      - name: Terraform Apply
        working-directory: sdtcc/infra
        run: terraform apply -auto-approve -var="n2yo_api_key=${{ secrets.N2YO_API_KEY }}"

      - name: Exibir outputs
        working-directory: sdtcc/infra
        run: terraform output

      - name: Logout Azure
        run: az logout
        if: always()
