name: Provisionar Infraestrutura (Terraform)

on:
  workflow_dispatch:
  push:
    paths:
      - 'sdtcc/infra/**'

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: sdtcc/infra
        run: terraform init

      - name: Terraform Plan
        working-directory: sdtcc/infra
        run: terraform plan -var="n2yo_api_key=${{ secrets.N2YO_API_KEY }}"

      - name: Terraform Apply
        working-directory: sdtcc/infra
        run: terraform apply -auto-approve -var="n2yo_api_key=${{ secrets.N2YO_API_KEY }}"

      - name: Exibir outputs
        working-directory: sdtcc/infra
        run: terraform output

      - name: Logout Azure
        run: az logout
        if: always()
