name: Provisionar Infraestrutura (Terraform)

on:
  workflow_dispatch:
  push:
    paths:
      - 'infra/**'

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Login no Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validar secrets do GitHub
        run: |
          if [ -z "${{ secrets.N2YO_API_KEY }}" ]; then
            echo "ERRO: N2YO_API_KEY nao configurado no GitHub Secrets"
            exit 1
          fi

          echo "N2YO_API_KEY encontrado"

      - name: Exportar credenciais ARM para o Terraform
        run: |
          echo "ARM_CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientId)" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientSecret)" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .subscriptionId)" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .tenantId)" >> $GITHUB_ENV

      - name: Criar backend de state (Azure Storage)
        run: |
          az group create \
            --name rg-tfstate \
            --location eastus2 \
            --output none

          az storage account create \
            --name stspacedebristf26 \
            --resource-group rg-tfstate \
            --location eastus2 \
            --sku Standard_LRS \
            --output none || true

          az storage container create \
            --name tfstate \
            --account-name stspacedebristf26 \
            --output none || true

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra
        run: |
          terraform plan \
            -var="n2yo_api_key=${{ secrets.N2YO_API_KEY }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan

      - name: Mostrar recursos do state
        working-directory: infra
        run: terraform state list

      - name: Verificar secret no state
        working-directory: infra
        run: terraform state show azurerm_key_vault_secret.n2yo_key

      - name: Exibir outputs
        working-directory: infra
        run: terraform output

      - name: Logout Azure
        if: always()
        run: az logout