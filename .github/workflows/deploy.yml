name: Deploy SpaceDebris Tracker

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurar App Service
        run: |
          az webapp config appsettings set \
            --name ${{ secrets.AZURE_APP_NAME }} \
            --resource-group rg-spacedebris-tracker \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true
          az webapp config set \
            --name ${{ secrets.AZURE_APP_NAME }} \
            --resource-group rg-spacedebris-tracker \
            --startup-file "gunicorn --bind=0.0.0.0 --timeout 600 app:app"

      - name: Zipar codigo fonte
        run: |
          cd app
          zip -r ../release.zip . \
            -x "*.pyc" \
            -x "*/__pycache__/*" \
            -x "__pycache__/*"

      - name: Deploy para Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          package: release.zip

      - name: Verificar status
        run: |
          az webapp show \
            --name ${{ secrets.AZURE_APP_NAME }} \
            --resource-group rg-spacedebris-tracker \
            --query "{estado:state,url:defaultHostName}" \
            --output table

      - name: Logout Azure
        run: az logout
        if: always()
