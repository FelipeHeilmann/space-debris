name: Deploy SpaceDebris Tracker

on:
  push:
    branches: [main]
    paths:
      - 'sdtcc/app/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        working-directory: sdtcc/app
        run: |
          pip install -r requirements.txt
          python -c "from app import app; print('App OK')"

      - name: Login no Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          package: sdtcc/app

      - name: Configurar startup command
        run: |
          az webapp config set \
            --name ${{ secrets.AZURE_APP_NAME }} \
            --resource-group rg-spacedebris-tracker \
            --startup-file "gunicorn --bind=0.0.0.0:8000 --timeout 600 app:app"

      - name: Verificar aplicacao no ar
        run: |
          sleep 40
          curl -f https://${{ secrets.AZURE_APP_NAME }}.azurewebsites.net/api/status
          echo "Deploy realizado com sucesso"

      - name: Logout Azure
        run: az logout
        if: always()
