name: Deploy SpaceDebris Tracker

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias localmente (pre-built)
        run: |
          pip install -r app/requirements.txt \
            --target app/.python_packages/lib/site-packages

      - name: Validar aplicacao
        working-directory: app
        run: |
          PYTHONPATH=.python_packages/lib/site-packages python -c "from app import app; print('App OK')"

      - name: Login no Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurar startup e desabilitar build no servidor
        run: |
          az webapp config appsettings set \
            --name ${{ secrets.AZURE_APP_NAME }} \
            --resource-group rg-spacedebris-tracker \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false
          az webapp config set \
            --name ${{ secrets.AZURE_APP_NAME }} \
            --resource-group rg-spacedebris-tracker \
            --startup-file "python -m gunicorn --bind=0.0.0.0:8000 --timeout 600 app:app"

      - name: Zipar aplicacao com dependencias
        run: |
          cd app
          zip -r ../app.zip . \
            -x "*.pyc" \
            -x "*/__pycache__/*" \
            -x "__pycache__/*"

      - name: Deploy para Azure App Service
        run: |
          az webapp deploy \
            --resource-group rg-spacedebris-tracker \
            --name ${{ secrets.AZURE_APP_NAME }} \
            --src-path app.zip \
            --type zip \
            --async true

      - name: Aguardar inicializacao (sem build no servidor e rapido)
        run: sleep 30

      - name: Verificar status do App Service
        run: |
          az webapp show \
            --name ${{ secrets.AZURE_APP_NAME }} \
            --resource-group rg-spacedebris-tracker \
            --query "{estado:state,url:defaultHostName}" \
            --output table

      - name: Logout Azure
        run: az logout
        if: always()
