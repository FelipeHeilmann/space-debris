name: Deploy SpaceDebris Tracker

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias e validar app
        working-directory: app
        run: |
          pip install -r requirements.txt
          python -c "from app import app; print('App OK')"

      - name: Login no Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Zipar e fazer deploy via az cli
        run: |
          cd app
          zip -r ../app.zip . -x "*.pyc" -x "__pycache__/*" -x ".git/*"
          cd ..
          az webapp deploy \
            --resource-group rg-spacedebris-tracker \
            --name ${{ secrets.AZURE_APP_NAME }} \
            --src-path app.zip \
            --type zip

      - name: Configurar startup command
        run: |
          az webapp config set \
            --name ${{ secrets.AZURE_APP_NAME }} \
            --resource-group rg-spacedebris-tracker \
            --startup-file "gunicorn --bind=0.0.0.0:8000 --timeout 600 app:app"

      - name: Reiniciar App Service
        run: |
          az webapp restart \
            --name ${{ secrets.AZURE_APP_NAME }} \
            --resource-group rg-spacedebris-tracker

      - name: Logout Azure
        run: az logout
        if: always()
